/workmate/salary-periods:
  post:
    summary: "Generates draft salary periods for active companies"
    description: "Executes the cycle generation batch for companies starting their pay period today. Uses query/body dates or defaults to current system date."
    tags:
      - SalaryPeriod
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              year:
                type: integer
                example: 2026
                description: "4-digit year (defaults to current year)"
              month:
                type: integer
                example: 9
                description: "1-indexed human month 1-12 (defaults to current month)"
    responses:
      "201":
        description: "Salary periods generated successfully"
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Salary periods generated successfully"
                data:
                  type: object
                  properties:
                    created:
                      type: integer
                      example: 5
                    skipped:
                      type: integer
                      example: 0
      "400":
        description: "Bad Request - Invalid year or month input"
      "500":
        description: "Internal Server Error"

# get all salary periods
/workmate/fetch-salaryPeriods:
  get:
    summary: "Fetches all salary period raws of a company"
    description: "by fetching salary period start and end date we can easily filter data in frontend"
    tags:
      - SalaryPeriod
    responses:
      "200":
        description: "Salary periods fetched successfully"
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                salaryPeriods:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      companyId:
                        type: integer
                        example: 1
                      year:
                        type: integer
                        example: 2026
                      month:
                        type: integer
                        example: 10
                      startDate:
                        type: string
                        format: date
                        example: "2026-10-14"
                      endDate:
                        type: string
                        format: date
                        example: "2026-11-15"
                      status:
                        type: string
                        example: "draft"
                      createdAt:
                        type: string
                        format: date-time
                        example: "2026-10-16T13:14:58.000Z"
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2026-10-16T13:14:58.000Z"
                message:
                  type: string
                  example: "Salary periods fetched successfully"
      "400":
        description: "Bad Request - Invalid input"
      "500":
        description: "Internal Server Error"
