/workmate/admin/leave-status:
  put:
    summary: Leave&reject approve
    description: Admin can leave or reject and leave of a employee
    tags:
      - admin leave control
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - employeeId
              - leaveId
              - status
            properties:
              employeeId:
                type: integer
                example: 1
                description: Primary key and unique identifier of the employee
              leaveId:
                type: integer
                example: 1
                description: leave primary unique key
              status:
                type: string
                enum:
                  - approve
                  - reject
                example: approve

    responses:
      "200":
        description: Leave status updated successfully
      "500":
        description: Internal server error

# get all leave a active salary period range
/workmate/admin/leaves:
  get:
    summary: Get all leaves
    description: Get all leaves from a active salary period
    tags:
      - admin leave control
    responses:
      "200":
        description: All leaves fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: boolean
                  example: All leaves fetched successfully
                data:
                  $ref: "#/components/schemas/employeeLeave"

      "500":
        description: Internal server error
